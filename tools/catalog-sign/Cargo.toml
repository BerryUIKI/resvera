[package]
name = "resvera-catalog-sign"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so this tool never becomes a member of the main workspace
# and therefore never participates in `cargo test --workspace` or CI builds.
[workspace]

[dependencies]
# The signing payload is produced by `ModelCatalog::signing_payload` /
# `ModelCatalogEntry::signing_payload`. Depending on the real types instead of
# re-deriving the payload keeps this tool byte-identical to the verifier,
# which serializes struct fields in declaration order rather than in the
# lexicographic order `serde_json::Value` would impose.
resvera-models = { path = "../../crates/resvera-models" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
