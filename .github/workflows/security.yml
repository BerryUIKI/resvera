name: Security & Dependency Review

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  rust-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Cargo Dependencies
        # `rustsec/audit-check` reports by opening an issue, which needs
        # `issues: write`. This workflow deliberately holds no write
        # permissions, so the action failed on every push with
        # "Resource not accessible by integration" while passing on PRs, where
        # it takes a different reporting path. Running cargo audit directly
        # makes the exit status the signal and keeps the job read-only.
        run: |
          cargo install cargo-audit --locked
          cargo audit

  pnpm-audit:
    name: Frontend pnpm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Run pnpm Audit
        run: pnpm audit --registry https://registry.npmjs.org --audit-level high
