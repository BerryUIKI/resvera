name: Production Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      draft:
        description: "Publish as draft release"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: darwin-aarch64
            os: macos-latest
            # Apple Silicon only. The x86_64 half of a universal build is not
            # possible with the pinned ort-sys: ONNX Runtime ships no prebuilt
            # binaries for x86_64-apple-darwin, and building it from source is
            # out of scope. Intel Macs cannot install this release; recorded as
            # a known limitation in the release notes.
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.rust_targets }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Windows Signing Certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $certPath = Join-Path $env:TEMP "resvera-authenticode.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          Write-Output "TAURI_BUNDLE_WINDOWS_CERTIFICATE=$certPath" >> $env:GITHUB_ENV
          Write-Output "TAURI_BUNDLE_WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Setup macOS Signing & Notarization
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build Tauri Desktop Application & Bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # --target is required: without it Tauri builds only the host default
        # architecture, so the macOS job would produce a single-arch bundle
        # instead of a universal one.
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: Collect Platform Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # src-tauri is a member of the root Cargo workspace, so bundles are
          # written to the workspace-level target directory, not src-tauri/target.
          # With --target, Cargo nests the output under target/<triple>/release.
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $bundle = "target/${{ matrix.target }}/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "target/release/bundle" }
          Copy-Item -Path "$bundle/nsis/*.exe" -Destination "dist-artifacts/" -ErrorAction SilentlyContinue
          Copy-Item -Path "$bundle/msi/*.msi" -Destination "dist-artifacts/" -ErrorAction SilentlyContinue
          Copy-Item -Path "$bundle/nsis/*.zip" -Destination "dist-artifacts/" -ErrorAction SilentlyContinue
          Copy-Item -Path "$bundle/nsis/*.sig" -Destination "dist-artifacts/" -ErrorAction SilentlyContinue
          # An empty artifact set must fail here, not surface later as a confusing
          # updater-manifest error.
          $count = (Get-ChildItem -Path dist-artifacts -File | Measure-Object).Count
          if ($count -eq 0) {
            Write-Error "No artifacts collected from $bundle; the bundle step produced nothing."
            exit 1
          }
          Get-ChildItem -Path dist-artifacts | Select-Object Name, Length

      - name: Collect Platform Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          # Workspace-level target directory; see the Windows step above.
          bundle="target/${{ matrix.target }}/release/bundle"
          [ -d "$bundle" ] || bundle=target/release/bundle
          mkdir -p dist-artifacts
          cp -f "$bundle"/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          cp -f "$bundle"/macos/*.tar.gz dist-artifacts/ 2>/dev/null || true
          cp -f "$bundle"/macos/*.sig dist-artifacts/ 2>/dev/null || true
          if [ -z "$(ls -A dist-artifacts)" ]; then
            echo "::error::No artifacts collected from $bundle; the bundle step produced nothing."
            exit 1
          fi
          ls -la dist-artifacts

      - name: Collect Platform Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # Workspace-level target directory; see the Windows step above.
          bundle="target/${{ matrix.target }}/release/bundle"
          [ -d "$bundle" ] || bundle=target/release/bundle
          mkdir -p dist-artifacts
          cp -f "$bundle"/appimage/*.AppImage dist-artifacts/ 2>/dev/null || true
          cp -f "$bundle"/appimage/*.tar.gz dist-artifacts/ 2>/dev/null || true
          cp -f "$bundle"/appimage/*.sig dist-artifacts/ 2>/dev/null || true
          cp -f "$bundle"/deb/*.deb dist-artifacts/ 2>/dev/null || true
          if [ -z "$(ls -A dist-artifacts)" ]; then
            echo "::error::No artifacts collected from $bundle; the bundle step produced nothing."
            exit 1
          fi
          ls -la dist-artifacts

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: dist-artifacts/*

  generate-sbom:
    name: Generate CycloneDX SBOMs
    # Pinned: this job installs Python from .python-version, and
    # actions/setup-python has no 3.12.7 build for the ubuntu-26.04 image that
    # `ubuntu-latest` now resolves to. Mirrors the ci.yml fix in #105.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Install frontend dependencies
        # @cyclonedx/cyclonedx-npm reads node_modules and the pnpm lockfile as
        # its evidence. Without this install it fails with "missing evidence"
        # — the job set pnpm up but never ran an install.
        run: pnpm install --frozen-lockfile

      - name: Generate Rust CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom-artifacts
          # `cargo cyclonedx` operates on the whole workspace and writes one
          # .cdx.json per crate. The previous invocation used
          # `--all --output-format json`, which this CLI does not accept; the
          # flag is `--format`.
          cargo cyclonedx --format json --spec-version 1.5
          while IFS= read -r bom; do
            cp "$bom" sbom-artifacts/
          done < <(find crates src-tauri -name "*.cdx.json" -type f)
          # Keep a stable top-level name for the desktop crate.
          cp sbom-artifacts/resvera-desktop.cdx.json sbom-artifacts/sbom-rust.cdx.json
          if [ -z "$(ls -A sbom-artifacts)" ]; then
            echo "::error::No Rust SBOM files were produced."
            exit 1
          fi
          ls -la sbom-artifacts

      - name: Generate Node CycloneDX SBOM
        run: |
          set -euo pipefail
          # `@cyclonedx/cyclonedx-npm` (documented in RELEASE_SECURITY.md since
          # #89, never actually run to completion) reads npm's package-lock.json,
          # which this project does not have — it uses pnpm. It fails with
          # "missing evidence" on every run. pnpm 11 has a native SBOM command
          # that reads the pnpm lockfile directly, so use that instead.
          pnpm sbom --sbom-format cyclonedx --sbom-type application > sbom-artifacts/sbom-node.cdx.json
          python3 -c "
          import json
          d = json.load(open('sbom-artifacts/sbom-node.cdx.json'))
          assert d.get('bomFormat') == 'CycloneDX', 'not a CycloneDX document'
          print('node SBOM:', len(d.get('components', [])), 'components')
          "

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-sbom
          path: sbom-artifacts/*

  assemble-and-release:
    name: Verify, Attest & Publish Release
    needs: [build-release, generate-sbom]
    # Pinned for the same Python-version reason as generate-sbom above.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Release Assets
        run: |
          mkdir -p dist
          find downloaded-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate SHA256 Checksums
        run: |
          python3 tools/release/verify_release_artifacts.py --dist-dir dist --generate-checksums

      - name: Assemble Tauri latest.json Updater Manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c "
          import json, os, glob, datetime
          from pathlib import Path

          tag = os.environ.get('RELEASE_TAG', 'v0.1.0')
          version = tag.lstrip('v')
          manifest = {
              'version': version,
              'notes': f'Resvera release {tag}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'platforms': {}
          }

          # Map updater packages
          dist = Path('dist')
          for sig_file in dist.glob('*.sig'):
              pkg_name = sig_file.stem
              pkg_path = dist / pkg_name
              if not pkg_path.exists():
                  continue
              sig_content = sig_file.read_text().strip()
              url = f'https://github.com/BerryUIKI/resvera/releases/download/{tag}/{pkg_name}'

              if 'x64' in pkg_name or 'nsis' in pkg_name:
                  manifest['platforms']['windows-x86_64'] = {'signature': sig_content, 'url': url}
              elif 'darwin' in pkg_name or 'aarch64' in pkg_name:
                  manifest['platforms']['darwin-aarch64'] = {'signature': sig_content, 'url': url}
              elif 'AppImage' in pkg_name or 'amd64' in pkg_name:
                  manifest['platforms']['linux-x86_64'] = {'signature': sig_content, 'url': url}

          with open('dist/latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          cat dist/latest.json

      - name: Pre-Promotion Release Verification Gate
        run: |
          python3 tools/release/verify_release_artifacts.py \
            --dist-dir dist \
            --expected-version "${{ github.ref_name }}" \
            --require-sbom \
            --require-updater

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: ${{ github.event.inputs.draft || false }}
          generate_release_notes: true
