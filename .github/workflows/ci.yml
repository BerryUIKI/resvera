name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Hygiene, Lint & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff Hygiene Check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/${{ github.base_ref }}...HEAD
          else
            git diff --check HEAD~1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Clippy Warnings Denied
        run: cargo clippy --all-targets -- -D warnings

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/export/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Export & Parity Toolchain Tests
        run: python3 -m unittest discover -s tools/export

      - name: Release Verification Tool Tests
        run: python3 -m unittest discover -s tools/release

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck, Tests & Build
        run: pnpm run check && pnpm run test && pnpm run build

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Tauri Desktop No-Bundle Build Check
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features
